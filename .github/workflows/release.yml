name: Addon-release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        python-version: "3.13"

    - name: Install dependencies
      run: uv sync

    - name: Lint
      run: uv run ruff check addon

    - name: Validate addon.toml
      run: uv run nvaddon check

    - name: Build addon
      run: uv run nvaddon build

    - name: Upload release
      id: release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref_name }}
        files: |
          *.nvda-addon
        generate_release_notes: true
        prerelease: ${{ !endsWith(github.ref, '-stable') }}

    - name: extract addon info
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        uv run python -c '
        import os, tomllib
        addon = tomllib.load(open("addon.toml", "rb"))["addon"]
        fields = {
            "ADDON_NAME": addon["name"],
            "ADDON_VERSION": addon["version"],
            "ADDON_CHANNEL": addon.get("updateChannel") or "stable",
        }
        with open(os.environ["GITHUB_ENV"], "a") as env:
            for key, value in fields.items():
                env.write(f"{key}={value}\n")
        '

    - name: submit addon
      if: startsWith(github.ref, 'refs/tags/')
      uses: beqabeqa473/submitNVDAAddon@v1
      with:
        addon_name: ${{ env.ADDON_NAME }}
        addon_version: ${{ env.ADDON_VERSION }}
        download_url: ${{ fromJSON(steps.release.outputs.assets)[0].browser_download_url }}
        channel: ${{ env.ADDON_CHANNEL }}
        token: ${{ secrets.USER_TOKEN }}
